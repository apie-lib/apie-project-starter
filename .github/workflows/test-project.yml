name: Test project starter

on:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test-project:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
        framework: [Laravel, Symfony]
        setup: [minimal, preferred, maximum]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
      - name: Generate project
        run: make test-project
        env:
          APIE_STARTER_SETUP: ${{ matrix.setup }}
          APIE_STARTER_ENABLE_CMS: 'true'
          APIE_STARTER_FRAMEWORK: ${{ matrix.framework }}
          APIE_STARTER_ENABLE_USER: 'true'
          APIE_STARTER_ENABLE_2FA: 'false'
